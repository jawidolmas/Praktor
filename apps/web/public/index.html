<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Praktor Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Praktor <span>supervisor dashboard</span></div>
    <div class="muted mono" id="clock"></div>
  </header>
  <main>
    <section class="panel">
      <h2>Daemon</h2>
      <div id="daemon-status"><div class="empty">Loading…</div></div>
    </section>

    <section class="panel" id="decisionsPanel" hidden>
      <h2>Decisions needing an answer</h2>
      <div id="decisions"></div>
    </section>

    <section class="panel">
      <h2>Objectives</h2>
      <div id="objective-summary" class="summary-row"></div>
      <div class="toolbar">
        <div class="filter-tabs" id="statusFilter">
          <button class="filter-tab active" data-filter="attention">Needs attention</button>
          <button class="filter-tab" data-filter="all">All</button>
          <button class="filter-tab" data-filter="done">Done</button>
          <button class="filter-tab" data-filter="failed">Failed</button>
        </div>
        <input type="text" id="objectiveSearch" class="search-input" placeholder="Filter by title or repo…" />
      </div>
      <div id="objectives"><div class="empty">Loading…</div></div>
    </section>

    <section class="panel">
      <h2>Policies</h2>
      <div id="policies"><div class="empty">Loading…</div></div>
    </section>

    <footer class="hint">Objectives are driven by the supervisor daemon — this page just reads and, for decisions, answers into the same database.</footer>
  </main>

  <script src="/app.js"></script>
  <script src="/index.js"></script>
</body>
</html>
